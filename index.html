<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body{
        font-family: Arial, sans-serif;
        background: #f3f3f3;
        margin: 0;
        padding: 0;
      }
      .contenedor{
        max-width: 800px;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        padding: 20px 24px 30px;
      }
      h2{
        margin-top: 0;
        margin-bottom: 6px;
      }
      p{
        margin-top: 4px;
        margin-bottom: 8px;
      }
      table{
        border-collapse: collapse;
        width: 100%;
        margin-top: 10px;
        font-size: 14px;
      }
      th, td{
        border: 1px solid #ddd;
        padding: 6px;
        text-align: center;
      }
      th{
        background: #f0f0f0;
      }
      input[type="number"]{
        width: 75px;
        font-size: 14px;
        text-align: center;
        padding: 4px;
        box-sizing: border-box;
      }
      input[type="text"]{
        font-size: 14px;
        padding: 4px 6px;
      }
      .fila-total{
        margin-top: 12px;
        font-size: 18px;
        font-weight: bold;
        text-align: right;
      }
      .btn{
        padding: 10px 20px;
        margin-top: 12px;
        cursor: pointer;
        background: #1976d2;
        border: none;
        border-radius: 4px;
        color: #fff;
        font-size: 15px;
      }
      .btn:hover{
        background: #155a9c;
      }
      .btn-toggle-otros{
        display: block;
        width: 100%;
        margin-top: 10px;
        padding: 8px 12px;
        background: #eef3f8;
        color: #1976d2;
        border: 1px dashed #1976d2;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 13px;
        transition: background 0.2s;
      }
      .btn-toggle-otros:hover{
        background: #dbe8f5;
      }
      #ticket{
        margin-top: 20px;
        border-top: 2px solid #000;
        padding-top: 10px;
        display: none;
      }
      #mensaje{
        margin-top: 10px;
        color: red;
        font-weight: bold;
      }
      #stockAviso{
        margin-top: 6px;
        color: #c47a00;
        font-weight: bold;
      }
      .encabezado-form{
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .encabezado-form > div{
        margin-top: 4px;
      }

      .stock-cell{
        font-weight: bold;
        color: #333;
      }

      /* SOLO imprimir el ticket */
      @media print {
        body{
          background:#ffffff;
        }
        .contenedor > *{
          display:none !important;
        }
        .contenedor #ticket{
          display:block !important;
          border-top:none;
          margin-top:0;
          padding-top:0;
        }
        .btn, .btn-toggle-otros{
          display:none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <h2>Venta de formularios</h2>
      <p><b>Pasos:</b> 1) Escriba las cantidades.  2) Verifique el total.  3) Haga clic en <b>Emitir ticket</b>.</p>

      <form id="ventaForm" onsubmit="enviarVenta(); return false;">
        <div class="encabezado-form">
          <div>
            <label>Cliente (opcional): 
              <input type="text" name="cliente" placeholder="Nombre / CUIT">
            </label>
          </div>
          <div class="fila-total">
            Total actual: $ <span id="totalActual">0</span>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Descripción</th>
              <th>Precio</th>
              <th>Stock disp.</th>
              <th>Cantidad</th>
            </tr>
          </thead>
          <!-- Formularios Principales -->
          <tbody>
            <? 
               var codigosPrincipales = ['F08', 'F12', '59U', 'F02', 'F04'];
               var sinStockArray = ['08D', 'TP', '11', '57'];
               var otros = [];
               for (var i = 0; i < productos.length; i++) {
                 var p = productos[i];
                 var cod = String(p[0]).trim().toUpperCase();
                 if (codigosPrincipales.indexOf(cod) !== -1) {
            ?>
              <tr>
                <td><b><?= p[0] ?></b></td>
                <td><?= p[1] ?></td>
                <td>$ <?= p[2] ?></td>
                <td class="stock-cell"><?= p[4] ?></td>
                <td>
                  <input
                    type="number"
                    min="0"
                    value="0"
                    name="cant_<?= p[0] ?>"
                    data-precio="<?= p[2] ?>"
                  >
                </td>
              </tr>
            <? 
                 } else {
                   otros.push(p);
                 }
               } 
            ?>
          </tbody>

          <!-- Formularios Secundarios Desplegables (08D, TP, 11, 57, etc.) -->
          <tbody id="tablaOtrosFormularios" style="display: none; background: #fafafa;">
            <? for (var j = 0; j < otros.length; j++) {
                 var o = otros[j]; 
                 var esSinStock = sinStockArray.indexOf(String(o[0]).trim().toUpperCase()) !== -1;
            ?>
              <tr>
                <td><b><?= o[0] ?></b></td>
                <td><?= o[1] ?></td>
                <td>$ <?= o[2] ?></td>
                <td class="stock-cell"><?= esSinStock ? '-' : (o[4] || 0) ?></td>
                <td>
                  <input
                    type="number"
                    min="0"
                    value="0"
                    name="cant_<?= o[0] ?>"
                    data-precio="<?= o[2] ?>"
                  >
                </td>
              </tr>
            <? } ?>
          </tbody>
        </table>

        <? if (otros.length > 0) { ?>
          <button type="button" class="btn-toggle-otros" id="btnToggleOtros" onclick="toggleOtrosFormularios()">
            ➕ Ver otros formularios (08D, TP, 11, 57...)
          </button>
        <? } ?>

        <button type="submit" class="btn">Emitir ticket</button>
      </form>

      <div id="mensaje"></div>
      <div id="stockAviso"></div>

      <div id="ticket">
        <h3>Comprobante de formularios</h3>
        <div id="ticketContenido"></div>

        <button class="btn" type="button" onclick="imprimirTicket()">Imprimir</button>
        <button
          class="btn"
          type="button"
          style="background:#555; margin-left:10px;"
          onclick="nuevaVenta()"
        >
          Nueva venta
        </button>
      </div>
    </div>

    <script>
      function toggleOtrosFormularios() {
        var tbody = document.getElementById('tablaOtrosFormularios');
        var btn = document.getElementById('btnToggleOtros');
        if (tbody.style.display === 'none' || tbody.style.display === '') {
          tbody.style.display = 'table-row-group';
          btn.innerText = '➖ Ocultar otros formularios';
        } else {
          tbody.style.display = 'none';
          btn.innerText = '➕ Ver otros formularios (08D, TP, 11, 57...)';
        }
      }

      function recalcularTotal(){
        var total = 0;
        var ins = document.querySelectorAll('input[type="number"][data-precio]');
        ins.forEach(function(inp){
          var cant   = parseFloat(inp.value)  || 0;
          var precio = parseFloat(inp.dataset.precio) || 0;
          total += cant * precio;
        });
        document.getElementById('totalActual').innerText = total.toFixed(2);
      }

      function enviarVenta(){
        document.getElementById('mensaje').innerText = 'Procesando...';
        document.getElementById('stockAviso').innerText = '';
        document.getElementById('ticket').style.display = 'none';

        var form = document.getElementById('ventaForm');
        var fd = new FormData(form);
        var obj = {};
        fd.forEach(function(value, key){
          obj[key] = value;
        });

        google.script.run
          .withSuccessHandler(onRespuesta)
          .withFailureHandler(onError)
          .procesarVentaWeb(obj);
      }

      // Colores por código (para el ticket impreso)
      function colorParaCodigo(codigo){
        switch(String(codigo).trim().toUpperCase()){
          case 'F08': return '#e6f4e6';  // verde suave
          case 'F12': return '#fff9c4';  // amarillo
          case '59U': return '#ffe0b2';  // naranja
          case 'F02': return '#e1bee7';  // violeta
          case 'F04': return '#c5cae9';  // lila
          case '08D': return '#dcedc8';  // verde agua
          case 'TP':  return '#b2dfdb';  // turquesa suave
          case '11':  return '#ffccbc';  // coral suave
          case '57':  return '#d1c4e9';  // lavanda
          default:    return '#f5f5f5';
        }
      }

      function onRespuesta(resp){
        var msg        = document.getElementById('mensaje');
        var stockAviso = document.getElementById('stockAviso');
        msg.innerText = '';
        stockAviso.innerText = '';

        if(!resp || !resp.ok){
          msg.innerText = (resp && resp.error) ? resp.error : 'Error desconocido';
          return;
        }

        if (resp.lowStock && resp.lowStock.length > 0){
          var texto = 'ATENCIÓN: stock bajo en ';
          texto += resp.lowStock.map(function(it){
            return it.codigo + ' (quedan ' + it.stock + ')';
          }).join(', ');
          stockAviso.innerText = texto;
        }

        var t = resp.ticket;
        var html = '';
        html += '<p><b>ID:</b> ' + t.idVenta + '</p>';
        html += '<p><b>Fecha:</b> ' + t.fecha + '</p>';
        if(t.cliente){
          html += '<p><b>Cliente:</b> ' + t.cliente + '</p>';
        }

        html += '<table><tr><th>Código</th><th>Descripción</th><th>Precio</th><th>Cant.</th><th>Total</th></tr>';
        for(var i = 0; i < t.items.length; i++){
          var it = t.items[i];
          var color = colorParaCodigo(it.codigo);
          html += '<tr>' +
                    '<td style="background:' + color + ';">' + it.codigo + '</td>' +
                    '<td>' + (it.descripcion || '') + '</td>' +
                    '<td>$ ' + it.precio + '</td>' +
                    '<td>' + it.cantidad + '</td>' +
                    '<td>$ ' + it.total + '</td>' +
                  '</tr>';
        }
        html += '<tr><td colspan="4" style="text-align:right;"><b>Total</b></td><td><b>$ ' + t.total + '</b></td></tr>';
        html += '</table>';

        document.getElementById('ticketContenido').innerHTML = html;
        document.getElementById('ticket').style.display = 'block';

        document.querySelectorAll('input[type="number"][data-precio]').forEach(function(inp){
          inp.value = 0;
        });
        recalcularTotal();
      }

      function onError(err){
        document.getElementById('mensaje').innerText = 'Error del servidor.';
        console.error(err);
      }

      function nuevaVenta(){
        document.getElementById('ticket').style.display = 'none';

        var form = document.getElementById('ventaForm');
        if (form) form.reset();

        document.querySelectorAll('input[type="number"][data-precio]').forEach(function(inp){
          inp.value = 0;
        });

        document.getElementById('mensaje').innerText = '';
        document.getElementById('stockAviso').innerText = '';
        recalcularTotal();

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function imprimirTicket(){
        window.print();
        setTimeout(nuevaVenta, 1000);
      }

      window.addEventListener('load', function(){
        document.querySelectorAll('input[type="number"][data-precio]').forEach(function(inp){
          inp.addEventListener('input', recalcularTotal);
        });
        recalcularTotal();
      });
    </script>
  </body>
</html>
